<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlanner - Calendário</title>

    <link rel="stylesheet" href="css/barra-lateral.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="sidebar">
        <ul>
            <li>
                <span class="logo">StudyPlanner</span>
            </li>

            <li>
                <a href="inicio.html" class="item">
                    <i class="bi bi-house"></i>
                    Início
                </a>
            </li>

            <li>
                <a href="disciplinas.html" class="item">
                    <i class="bi bi-book"></i>
                    Disciplinas
                </a>
            </li>

            <li>
                <a href="atividades.html" class="item">
                    <i class="bi bi-calendar-check"></i>
                    Atividades
                </a>
            </li>

            <li>
                <a href="calendario.html" class="item active">
                    <i class="bi bi-calendar3"></i>
                    Calendário
                </a>
            </li>
        </ul>

        <div class="config-container">
            <a href="#" class="config">
                <i class="bi bi-gear-fill"></i>
                Configurações
            </a>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="conteudo">

        <header class="cabecalho">
            <div class="titulo">
                <h2>Calendário</h2>
                <h4>Visualize provas, trabalhos e tarefas por data.</h4>
            </div>
        </header>

        <!-- Calendário -->
        <section class="calendario-container">

            <h3 class="mes">SETEMBRO 2026</h3>

            <div class="calendario">

                <!-- Cabeçalho dos dias -->
                <div class="dia-semana">SEG</div>
                <div class="dia-semana">TER</div>
                <div class="dia-semana">QUA</div>
                <div class="dia-semana">QUI</div>
                <div class="dia-semana">SEX</div>
                <div class="dia-semana">SÁB</div>
                <div class="dia-semana">DOM</div>

                <!-- Semana 1 -->
                <div class="dia">
                    <span class="numero">1</span>
                </div>

                <div class="dia">
                    <span class="numero">2</span>
                </div>

                <div class="dia">
                    <span class="numero">3</span>
                </div>

                <div class="dia">
                    <span class="numero">4</span>
                </div>

                <div class="dia">
                    <span class="numero">5</span>
                </div>

                <div class="dia">
                    <span class="numero">6</span>
                </div>

                <div class="dia">
                    <span class="numero">7</span>
                </div>

                <!-- Semana 2 -->
                <div class="dia">
                    <span class="numero">8</span>
                </div>

                <div class="dia">
                    <span class="numero">9</span>
                </div>

                <div class="dia">
                    <span class="numero">10</span>
                </div>

                <div class="dia">
                    <span class="numero">11</span>
                </div>

                <div class="dia">
                    <span class="numero">12</span>
                </div>

                <div class="dia">
                    <span class="numero">13</span>
                </div>

                <div class="dia">
                    <span class="numero">14</span>
                </div>

                <!-- Semana 3 -->
                <div class="dia">
                    <span class="numero">15</span>
                </div>

                <div class="dia">
                    <span class="numero">16</span>
                </div>

                <div class="dia">
                    <span class="numero">17</span>
                </div>

                <div class="dia evento-prova">
                    <span class="numero">18</span>

                    <div class="evento prova">
                        <span class="bolinha-evento"></span>
                        Prova
                    </div>
                </div>

                <div class="dia">
                    <span class="numero">19</span>
                </div>

                <div class="dia evento-trabalho">
                    <span class="numero">20</span>

                    <div class="evento trabalho">
                        <span class="bolinha-evento"></span>
                        Trabalho
                    </div>
                </div>

                <div class="dia">
                    <span class="numero">21</span>
                </div>

                <!-- Semana 4 -->
                <div class="dia evento-tarefa">
                    <span class="numero">22</span>

                    <div class="evento tarefa">
                        <span class="bolinha-evento"></span>
                        Tarefa
                    </div>
                </div>

                <div class="dia">
                    <span class="numero">23</span>
                </div>

                <div class="dia">
                    <span class="numero">24</span>
                </div>

                <div class="dia">
                    <span class="numero">25</span>
                </div>

                <div class="dia">
                    <span class="numero">26</span>
                </div>

                <div class="dia">
                    <span class="numero">27</span>
                </div>

                <div class="dia">
                    <span class="numero">28</span>
                </div>

                <!-- Semana 5 -->
                <div class="dia">
                    <span class="numero">29</span>
                </div>

                <div class="dia">
                    <span class="numero">30</span>
                </div>

            </div>

        </section>

    </main>

</body>

</html>

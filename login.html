<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/tema.css" />
    <script src="js/tema.js"></script>
    <title>Login</title>
</head>
<body>
    <button type="button" class="tema-toggle" data-alternar-tema aria-label="Ativar modo noturno" title="Ativar modo noturno">
        <svg class="tema-lua" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" /></svg>
        <svg class="tema-sol" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
    </button>
    <div class="container">
        <span class="Cabecalho">
            <h1>StudyPlanner</h1>
            <h2>Organize seus estudos em um só lugar.</h2>
        </span>
        <span class="formulario">
            <form>
                <div class="login-senha">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username" required placeholder="email@exemplo.com">

                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <div class="lembrar-esqueci">
                    <label>
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </span>
        <span class="cadastro">
            <p>Ainda não possui uma conta?</p>
            <a href="cadastro.html">Cadastre-se</a>
            <p class="rodape">Seu planner acadêmico, simples e organizado.</p>
        </span>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css" />
    <title>Login</title>
</head>
<body>
    <div class="container">
        <span class="Cabecalho">
            <h1>StudyPlanner</h1>
            <h2>Organize seus estudos em um só lugar.</h2>
        </span>
        <span class="formulario">
            <form>
                <div class="login-senha">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username" required placeholder="email@exemplo.com">

                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <div class="lembrar-esqueci">
                    <label>
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </span>
        <span class="cadastro">
            <p>Ainda não possui uma conta?</p>
            <a href="cadastro.html">Cadastre-se</a>
            <p class="rodape">Seu planner acadêmico, simples e organizado.</p>
        </span>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlanner</title>
    <link rel="stylesheet" href="css\barra-lateral.css" />
    <link rel="stylesheet" href="css\style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body>
    <nav class="sidebar">
        <ul>
            <li><span class="logo">StudyPlanner</span></li>
            <li><a href="#" class="item active"><i class="bi bi-house"></i> Início</a></li>
            <li><a href="#" class="item"><i class="bi bi-book"></i> Disciplinas</a></li>
            <li><a href="#" class="item"><i class="bi bi-calendar-check"></i> Atividades</a></li>
            <li><a href="#" class="item"><i class="bi bi-calendar3"></i> Calendário</a></li>
        </ul>
        <div class="config-container">
            <a href="#" class="config"><i class="bi bi-gear-fill"></i>Configurações</a>
        </div>
    </nav><!-- Barra lateral -->
    <main class="conteudo">
        <div class="boas-vindas">
            <h2>Olá, estudante!</h2>
            <h4>Aqui está um resumo da sua rotina de estudos.</h4>
        </div><!-- Boas vindas -->
        <section class="cards-grid">
            <div class="card">
                <span class="card-number tarefas">5</span>
                <span class="texto">Tarefas pendentes</span>
            </div>
            <div class="card">
                <span class="card-number provas">2</span>
                <span class="texto">Provas próximas</span>
            </div>
            <div class="card">
                <span class="card-number trabalhos">3</span>
                <span class="texto">Trabalhos</span>
            </div>
            <div class="card">
                <span class="card-number concluidas">8</span>
                <span class="texto">Concluídas</span>
            </div>
        </section><!-- Grade de cartões -->
        <section class="visao-geral">
            <div class="proximas-atividades">
                <h3>Próximas atividades</h3>
                <div class="atividade"></div>
                <div class="atividade"></div>
                <div class="atividade"></div>
            </div><!-- Próximas atividades -->
            <d class="progresso">
                
            </d
            iv><!-- Progresso -->
        </section><!-- Visão Geral-->
    </main><!-- Conteúdo principal -->
</body>

</html>
